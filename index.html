<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VelociDrone Track Viewer</title>
<style>
  :root {
    --green: #128a4d;
    --green-dark: #0d6b3c;
    --green-deep: #0a5530;
    --mat: #42a06d;
    --red: #d9251c;
    --yellow: #f2b21c;
    --khaki: #b3a13f;
    --ink: #17251d;
    --muted: #5c7266;
    --card: #ffffff;
    --line: #d7e6dc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--green-dark); color: var(--ink); }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ---- Header : white bar, green italic race-poster title ---- */
  #header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; gap: 18px; padding: 10px 20px;
    background: var(--card);
    border-bottom: 4px solid var(--green);
    box-shadow: 0 2px 14px rgba(10, 60, 35, 0.25);
  }
  #badge {
    width: 40px; height: 40px; flex: 0 0 auto; border-radius: 8px;
    background: var(--yellow);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-style: italic; color: var(--red); font-size: 11px;
    border: 2px solid var(--red); letter-spacing: .5px;
  }
  #header h1 {
    font-size: 17px; margin: 0; font-weight: 900; font-style: italic;
    text-transform: uppercase; letter-spacing: .4px; color: var(--green);
  }
  #header .sub { font-size: 12px; color: var(--muted); font-weight: 600; }
  #trackSelect {
    margin-left: auto; background: var(--card); color: var(--ink);
    border: 2px solid var(--green); border-radius: 8px;
    padding: 7px 10px; font-size: 13px; font-weight: 600; cursor: pointer;
  }

  /* ---- Cards ---- */
  .card {
    position: absolute; z-index: 10; background: var(--card);
    border-radius: 12px; padding: 14px 16px;
    box-shadow: 0 6px 22px rgba(8, 50, 30, 0.3);
  }
  .card h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--green); margin: 0 0 10px; font-weight: 900; font-style: italic;
  }

  /* Layers / actions */
  #panel { top: 78px; left: 16px; width: 216px;
    max-height: calc(100dvh - 100px); overflow-y: auto; }
  .row { display: flex; align-items: center; justify-content: space-between;
    padding: 5px 0; font-size: 13px; font-weight: 600; }
  .row label { cursor: pointer; user-select: none; }
  .switch { position: relative; width: 36px; height: 20px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #c3d6c9; border-radius: 20px;
    transition: .18s; cursor: pointer; }
  .slider:before { content: ""; position: absolute; height: 14px; width: 14px;
    left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .18s; }
  input:checked + .slider { background: var(--green); }
  input:checked + .slider:before { transform: translateX(16px); }

  .btnrow { display: flex; gap: 8px; margin-top: 12px; }
  button.act {
    flex: 1; border-radius: 8px; padding: 9px 6px; font-size: 13px;
    cursor: pointer; font-weight: 800; transition: .15s;
    border: 2px solid var(--green); background: var(--card); color: var(--green);
  }
  button.act:hover { background: #eaf5ee; }
  button.act.primary { background: var(--red); border-color: var(--red); color: #fff; }
  button.act.primary:hover { filter: brightness(1.1); }

  /* Track materials card */
  #materials { top: 78px; right: 16px; width: 220px; }
  #materials .mi { display: flex; align-items: baseline; gap: 8px;
    font-size: 13px; font-weight: 600; padding: 3px 0; }
  #materials .mi b { color: var(--red); font-size: 15px; min-width: 26px;
    text-align: right; font-style: italic; }
  #materials .sep { border-top: 2px solid var(--line); margin: 8px 0; }
  #materials .mi.small { font-size: 12px; color: var(--muted); }
  #materials .mi.small b { color: var(--green); font-size: 13px; }

  /* Legend */
  #legend { bottom: 16px; left: 16px; padding: 10px 14px; }
  #legend .li { display: flex; align-items: center; gap: 9px; padding: 2px 0;
    font-size: 12px; font-weight: 600; color: var(--ink); }
  .sw { width: 14px; height: 14px; border-radius: 3px; flex: 0 0 auto;
    border: 1px solid rgba(0,0,0,.15); }

  #help { position: absolute; bottom: 16px; right: 16px; z-index: 10;
    font-size: 11.5px; color: #fff; text-align: right; line-height: 1.7;
    background: rgba(10, 70, 40, 0.75); border-radius: 10px; padding: 8px 12px;
    font-weight: 600; }
  #help b { color: var(--yellow); }

  /* Inspector */
  #inspector { display: none; bottom: 16px; right: 16px; width: 268px; z-index: 11; }
  #inspector h2 { display: flex; align-items: center; justify-content: space-between; }
  #insClose { border: none; background: none; color: var(--muted); font-size: 18px;
    cursor: pointer; line-height: 1; padding: 0 2px; font-weight: 700; }
  #insClose:hover { color: var(--red); }
  .ir { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0;
    font-size: 12px; border-bottom: 1px dashed var(--line); }
  .ir span { color: var(--muted); font-weight: 600; white-space: nowrap; }
  .ir b { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-weight: 600; text-align: right; word-break: break-all; }
  #inspector .btnrow button { padding: 6px 6px; }

  #loading { position: absolute; inset: 0; z-index: 20; display: flex;
    align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    background: var(--green-dark); font-size: 14px; color: #fff; font-weight: 700; }
  .spin { width: 36px; height: 36px; border: 4px solid rgba(255,255,255,.25);
    border-top-color: var(--yellow); border-radius: 50%; animation: sp 0.9s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }

  @media (max-width: 760px) {
    #panel { width: 180px; top: 70px; left: 10px; padding: 11px;
      max-height: calc(100dvh - 86px); }
    #materials, #legend, #help { display: none; }
    #header h1 { font-size: 13px; }
    #header .sub { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="header">
  <div id="badge">AU<br>FPV</div>
  <div>
    <h1 id="trackName">VelociDrone Track Viewer</h1>
    <div class="sub" id="trackSub">Loading…</div>
  </div>
  <select id="trackSelect"></select>
</div>

<div id="panel" class="card">
  <h2>Layers</h2>
  <div class="row"><label for="tGates">Gates</label>
    <span class="switch"><input type="checkbox" id="tGates" checked><span class="slider"></span></span></div>
  <div class="row"><label for="tFlags">Flags</label>
    <span class="switch"><input type="checkbox" id="tFlags" checked><span class="slider"></span></span></div>
  <div class="row"><label for="tNumbers">Sequence numbers</label>
    <span class="switch"><input type="checkbox" id="tNumbers" checked><span class="slider"></span></span></div>
  <div class="row"><label for="tLine">Racing line</label>
    <span class="switch"><input type="checkbox" id="tLine" checked><span class="slider"></span></span></div>
  <div class="row"><label for="tBarriers">Scenery / barriers</label>
    <span class="switch"><input type="checkbox" id="tBarriers" checked><span class="slider"></span></span></div>
  <div class="row"><label for="tCheckpoints">Hidden checkpoints</label>
    <span class="switch"><input type="checkbox" id="tCheckpoints"><span class="slider"></span></span></div>

  <div class="btnrow">
    <button class="act primary" id="btnFly">▶ Fly lap</button>
  </div>
  <div class="btnrow">
    <button class="act" id="btnTop">2D layout</button>
    <button class="act" id="btnReset">Reset view</button>
  </div>
</div>

<div id="materials" class="card">
  <h2>Track Materials</h2>
  <div id="matList"></div>
</div>

<div id="legend" class="card">
  <h2 style="margin-bottom:6px">Legend</h2>
  <div class="li"><span class="sw" style="background:#fff"></span> Race gate (2 m)</div>
  <div class="li"><span class="sw" style="background:var(--red)"></span> Dive gate / accents</div>
  <div class="li"><span class="sw" style="background:var(--khaki)"></span> Racing line (3D)</div>
  <div class="li"><span class="sw" style="background:repeating-linear-gradient(90deg,#ffd83d 0 6px,transparent 6px 10px)"></span> Ground trace</div>
  <div class="li"><span class="sw" style="background:repeating-conic-gradient(#111 0 25%, #fff 0 50%) 0 0/8px 8px"></span> Start / finish</div>
</div>

<div id="help">
  <b>Drag</b> rotate · <b>Scroll</b> zoom · <b>Right-drag</b> pan<br>
  <b>Click</b> any object to inspect it
</div>

<div id="inspector" class="card">
  <h2><span id="insTitle">Inspector</span><button id="insClose" title="Close (Esc)">×</button></h2>
  <div id="insBody"></div>
  <div class="btnrow">
    <button class="act" id="insPrev">‹</button>
    <button class="act" id="insFocus">Focus</button>
    <button class="act" id="insNext">›</button>
  </div>
</div>

<div id="loading"><div class="spin"></div><div>Loading track…</div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  }
}
</script>
<script type="module" src="app.js"></script>
</body>
</html>
